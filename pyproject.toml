[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice-first RAG assistant for a GP clinic"
readme = "README.md"
authors = [
    { email = "developersrinath24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "fastembed>=0.9.1",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-openai>=1.8.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "supabase>=2.34.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
